# Trusted synthetic diagnostics ONLY: this permits missing Landlock enforcement.
# No providers and no network allowlist. Not an untrusted-worker policy.
version: 1
filesystem_policy:
  read_only: [/usr, /bin, /lib, /lib64, /etc, /proc, /sys, /dev/urandom]
  read_write: [/sandbox, /tmp]
  include_workdir: true
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
