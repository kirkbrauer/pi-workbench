name: Foundation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: foundation-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Activate integrity-pinned pnpm through bundled Corepack
        run: |
          test "$(corepack --version)" = "0.34.6"
          corepack enable pnpm
          corepack install
      - name: Validate direct sources before dependency download
        run: node --experimental-strip-types packages/tooling/src/sources.ts
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check diagnostic helper syntax (no native VM execution in CI)
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: pnpm check
      - name: Block known high or critical vulnerabilities (including dev dependencies)
        run: pnpm audit --audit-level high
      - name: Check candidate commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm check:commits "$BASE_SHA" "$HEAD_SHA"
